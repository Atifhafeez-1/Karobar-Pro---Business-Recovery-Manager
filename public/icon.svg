<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Main Ledger / Business Book Icon -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Book Base -->
    <rect x="20" y="20" width="260" height="300" rx="24" fill="#ffffff" />
    <!-- Book Spine -->
    <path d="M20 20 H56 V320 H20 Z" fill="#0284c7" />
    <circle cx="38" cy="60" r="6" fill="#ffffff" opacity="0.6"/>
    <circle cx="38" cy="170" r="6" fill="#ffffff" opacity="0.6"/>
    <circle cx="38" cy="280" r="6" fill="#ffffff" opacity="0.6"/>
    
    <!-- Ledger Lines -->
    <rect x="80" y="60" width="160" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="80" y="95" width="120" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Cash / Recovery Badge -->
    <rect x="75" y="130" width="185" height="75" rx="14" fill="url(#cardGrad)"/>
    <text x="95" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">Rs ₨</text>
    <path d="M210 155 L225 170 L245 145" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Transaction History Bars -->
    <rect x="80" y="230" width="170" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="80" y="255" width="130" height="12" rx="6" fill="#10b981" opacity="0.3"/>
    <rect x="80" y="280" width="150" height="12" rx="6" fill="#3b82f6" opacity="0.3"/>
  </g>
  
  <!-- Modern Growth / Recovery Sparkle Badge -->
  <circle cx="390" cy="130" r="38" fill="#fbbf24" filter="url(#shadow)"/>
  <path d="M375 130 L385 140 L408 118" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
